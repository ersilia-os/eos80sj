Title: ANNalog Scaffold Hopping
Description: ANNalog is a transformer sequence-to-sequence model trained on 
  pairs of molecules tested in the same ChEMBL33 assay, which it treats as 
  analogues. The Ersilia model proposes scaffold hops of an input compound, 
  meaning analogues whose Bemis-Murcko scaffold differs from its own. It samples
  at the authors temperature of 1.2 and resamples to reach 100 hops where 
  possible. Acyclic inputs have no scaffold, so any ring-containing output 
  counts as a hop. Training excluded molecules above 600 Da, with over seven 
  rotatable bonds, or with elements beyond C, N, O, S, F, Cl and Br.
