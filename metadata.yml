Status: In progress
Title: ANNalog MedChem Analogue Generation
Description: Generates medicinal-chemistry analogues of an input compound, from 
  small edits such as substituent replacement through to scaffold hops that swap
  the core while keeping biological relevance. ANNalog is a transformer 
  sequence-to-sequence model trained on molecule pairs drawn from the same 
  ChEMBL33 bioactivity assay, on the premise that compounds tested together are 
  analogues in medicinal-chemistry space. On orexin-2 receptor antagonists from 
  patents, prefix-constrained generation recovered about a quarter of known 
  scaffolds; output diversity varies with the decoding mode.
